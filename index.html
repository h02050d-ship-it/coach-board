<!doctype html>

<title>経営コーチボード</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='sans-serif' font-size='36' font-weight='700' fill='white'%3Eコ%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#f7f8fa;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e9f0;--blue:#2563eb;--blue2:#eff6ff;--red:#dc2626;--orange:#d97706;--green:#16803c;--shadow:0 4px 18px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.65}button,input,select{font:inherit}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(247,248,250,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.topin{min-height:68px;display:flex;align-items:center;gap:14px}.title{font-size:21px;font-weight:800;letter-spacing:.02em}.headmeta{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}.btn{border:1px solid #cfd6e2;background:#fff;color:#344054;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:650}.btn:hover{border-color:#98a2b3}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.55;cursor:default}main{padding:26px 0 54px}section{margin-bottom:28px}.section-title{font-size:17px;margin:0 0 12px;font-weight:800}.card{background:var(--card);border:1px solid #edf0f5;border-radius:12px;box-shadow:var(--shadow)}.morning{padding:25px 28px;border-top:4px solid var(--blue)}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.08em}.morning h2{font-size:25px;line-height:1.35;margin:5px 0 15px}.policy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:13px}.policy{padding:18px}.policy h3{font-size:15px;margin:0 0 8px}.policy .date{color:var(--muted);font-size:11px}.expand{border:0;background:none;color:var(--blue);padding:7px 0 0;cursor:pointer;font-weight:700}.md{font-size:14px}.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}.md h1,.md h2,.md h3{line-height:1.4;margin:1em 0 .5em}.md h1{font-size:1.45em}.md h2{font-size:1.25em}.md h3{font-size:1.1em}.md p,.md ul,.md ol{margin:.65em 0}.md ul,.md ol{padding-left:1.55em}.md a{color:var(--blue);overflow-wrap:anywhere}.md code{background:#f0f2f5;padding:.1em .35em;border-radius:4px;font-size:.92em}.filters{padding:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab,.kindbtn{border:0;border-radius:8px;padding:7px 10px;background:#f2f4f7;color:#475467;cursor:pointer;font-size:13px;font-weight:650}.tab.active,.kindbtn.active{background:#dbeafe;color:#1d4ed8}.search,.select{border:1px solid #d7dce5;background:#fff;border-radius:8px;padding:7px 10px;color:var(--ink)}.search{margin-left:auto;width:190px}.summary{color:var(--muted);font-size:12px;margin:0 2px 10px}.project-list{overflow:hidden}.project-row{display:grid;grid-template-columns:82px minmax(250px,1fr) auto;gap:14px;padding:16px 17px;border-bottom:1px solid var(--line);align-items:start}.project-row:last-child{border-bottom:0}.project-row.done .project-name{text-decoration:line-through;color:#98a2b3}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;text-align:center;white-space:nowrap}.st-running{color:#067647;background:#ecfdf3}.st-waiting_user{color:#b54708;background:#fff6e8}.st-blocked{color:#b42318;background:#feeceb}.st-paused{color:#667085;background:#f2f4f7}.st-done{color:#98a2b3;background:#f2f4f7}.project-name{font-weight:800}.cat{font-size:10px;color:#475467;background:#f2f4f7;border-radius:5px;padding:2px 6px;margin-left:7px;vertical-align:2px}.next{font-size:13px;color:#475467;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:flex-start;justify-content:flex-end;gap:15px;color:#667085;font-size:11px;white-space:nowrap}.meta b{display:block;color:#344054;font-size:12px}.stars{color:#e5a000;letter-spacing:-1px}.warn{color:var(--orange)!important}.danger{color:var(--red)!important}.blocked-note{grid-column:2/-1;color:#b42318;background:#fff4f3;border-radius:7px;padding:5px 8px;font-size:11px}.history-card{overflow:hidden}.history-tools{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}.history-row{border-bottom:1px solid var(--line)}.history-row:last-child{border-bottom:0}.history-head{padding:13px 16px;display:grid;grid-template-columns:70px 95px 1fr auto;align-items:center;gap:10px;cursor:pointer}.history-head:hover{background:#fafbfc}.history-title{font-weight:700}.history-body{display:none;padding:0 18px 18px 181px}.history-row.open .history-body{display:block}.kind{font-size:10px;font-weight:800;border-radius:6px;padding:3px 6px;text-align:center;background:#eef2ff;color:#3730a3}.empty{padding:35px;text-align:center;color:var(--muted)}.loading{min-height:260px;display:grid;place-items:center}.spinner{width:34px;height:34px;border:4px solid #dbeafe;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;place-items:center;padding:20px}.gatebox{width:min(420px,100%);padding:30px}.gatebox h1{font-size:23px;margin:0 0 6px}.gatebox p{color:var(--muted);font-size:13px;margin:0 0 20px}.field{display:block;margin:12px 0;font-size:12px;font-weight:700}.field input{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid #cfd6e2;border-radius:9px}.keep{font-size:12px;color:#475467}.gatebox .primary{width:100%;margin-top:17px;padding:11px}.gateerr{min-height:22px;color:var(--red);font-size:12px;margin-top:10px}.hidden{display:none!important}
@media(max-width:720px){.wrap{width:min(100% - 20px,1100px)}.topin{flex-wrap:wrap;padding:10px 0;gap:8px}.title{width:100%;font-size:19px}.headmeta{margin-left:0;margin-right:auto;text-align:left}.morning{padding:20px}.morning h2{font-size:21px}.project-row{grid-template-columns:72px 1fr;gap:10px}.meta{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap;padding-left:82px}.blocked-note{grid-column:1/-1}.search{margin-left:0;flex:1;min-width:150px}.history-head{grid-template-columns:62px 78px 1fr}.history-head>span:last-child{display:none}.history-body{padding:0 15px 16px}.next{white-space:normal}.filters{align-items:stretch}.select{flex:1}}
</style>
<script src="https://h02050d-ship-it.github.io/tool-portal/tu.js" defer></script>
</head>
<body>
<div id="gate" class="gate"><form id="loginForm" class="gatebox card"><div class="eyebrow">HAYASHI LUMBER</div><h1>経営コーチボード</h1><p>共通パスワードでログインしてください。メールは任意です。</p><label class="field">メール（任意）<input id="gateMail" type="email" autocomplete="username" placeholder="name@example.com"></label><label class="field">共通パスワード<input id="gatePass" type="password" autocomplete="current-password" required></label><label class="keep"><input id="gateKeep" type="checkbox" checked> この端末でログインを保持する</label><button id="gateBtn" class="btn primary" type="submit">ログイン</button><div id="gateErr" class="gateerr" role="alert"></div></form></div>
<header id="header" class="top hidden"><div class="wrap topin"><div class="title">経営コーチボード</div><div id="lastUpdated" class="headmeta">最終更新 —</div><button id="refreshBtn" class="btn">更新</button><button id="logoutBtn" class="btn">ログアウト</button></div></header>
<main id="app" class="wrap hidden"><div class="loading"><div><div class="spinner"></div><div style="margin-top:12px;color:#667085">読み込み中…</div></div></div></main>
<script>
"use strict";
const API="https://script.google.com/macros/s/AKfycby6RTCYRAmBoGa0P4QDAb0mx_NeXARoHVncQtxp2X5IXUEYW86Jy2ECS9YPqhHFvzoZ/exec";
const CRED_KEY="hayazai_coach_cred";
const CACHE_KEY="hayazai_coach_cache";
const $=id=>document.getElementById(id);

/* ===== 資格情報（共通SSO: h02050d-ship-it.github.io の他ツールのログインを引き継ぐ）===== */
const SSO_KEY="hayazai_sso_cred";
const SSO_PEERS=["hayazai_board_cred","hayazai_seiso_cred","hayazai_rulebook_cred","hayazai_kaizen_cred","notify_creds_v1","seinodesk_cred","faxdesk_cred","orderdesk_cred","nippou_cred","hayazai_coach_cred"];
function ssoFind_(){
  const keys=[SSO_KEY].concat(SSO_PEERS);
  for(const k of keys){
    try{ const v=JSON.parse(localStorage.getItem(k)||"null");
      if(v){ const email=v.email||v.e, pass=v.pass||v.p; if(email&&pass) return {email:String(email),pass:String(pass)}; }
    }catch(e){}
  }
  return null;
}
function ssoWrite(email,pass){ try{ localStorage.setItem(SSO_KEY,JSON.stringify({email:email,pass:pass})); }catch(e){} }
function ssoClear(){ try{ localStorage.removeItem(SSO_KEY); }catch(e){} }
function creds(){
  try{ const v=JSON.parse(localStorage.getItem(CRED_KEY)||sessionStorage.getItem(CRED_KEY)||"null"); if(v&&v.email&&v.pass) return v; }catch(e){}
  const s=ssoFind_(); if(s){ try{ localStorage.setItem(CRED_KEY,JSON.stringify(s)); }catch(e){} return s; }
  return {};
}
function saveCreds(email,pass,keep){ const v=JSON.stringify({email,pass}); if(keep){ localStorage.setItem(CRED_KEY,v); sessionStorage.removeItem(CRED_KEY); } else { sessionStorage.setItem(CRED_KEY,v); localStorage.removeItem(CRED_KEY); } ssoWrite(email,pass); }
function clearCreds(){ localStorage.removeItem(CRED_KEY); sessionStorage.removeItem(CRED_KEY); localStorage.removeItem(CACHE_KEY); ssoClear(); }

let DATA={projects:[],briefs:[]}, projectFilter="all", categoryFilter="all", query="", historyKind="all";
const statusText={running:"進行中",waiting_user:"待ち",blocked:"詰まり",paused:"休止",done:"完了"};
const kindText={daily:"毎朝",weekly:"週次",monthly:"月次",quarterly:"四半期",annual:"年度"};
const policyText={weekly:"今週の重点",monthly:"今月のテーマ",quarterly:"今四半期",annual:"今年度"};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function inlineMd(s){return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function markdown(raw){
  const lines=esc(raw).replace(/\r\n?/g,"\n").split("\n"), out=[]; let list="";
  const close=()=>{if(list){out.push(`</${list}>`);list="";}};
  for(const line of lines){let m;if((m=line.match(/^(#{1,3})\s+(.+)$/))){close();out.push(`<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`);}else if((m=line.match(/^\s*-\s+(.+)$/))){if(list!=="ul"){close();out.push("<ul>");list="ul";}out.push(`<li>${inlineMd(m[1])}</li>`);}else if((m=line.match(/^\s*\d+\.\s+(.+)$/))){if(list!=="ol"){close();out.push("<ol>");list="ol";}out.push(`<li>${inlineMd(m[1])}</li>`);}else if(!line.trim()){close();}else{close();out.push(`<p>${inlineMd(line)}</p>`);}}
  close();return out.join("");
}
function localISO(d=new Date()){const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function parseDay(s){if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function dayDiff(a,b){return Math.floor((a-b)/86400000);}
function staleDays(p){const d=parseDay(p.last_progress);return d?Math.max(0,Math.min(60,dayDiff(parseDay(localISO()),d))):30;}
function dueDays(p){const d=parseDay(p.due);return d===null?null:dayDiff(d,parseDay(localISO()));}
function score(p){if(p.status==="done"||p.status==="paused")return -999;const dd=dueDays(p);let boost=0;if(dd!==null)boost=dd<0?30:dd<=3?20:dd<=7?12:dd<=14?6:0;return Number(p.impact||0)*10-Number(p.effort||0)*2+staleDays(p)*.4+boost+(p.status==="blocked"?8:0)+(p.status==="waiting_user"?5:0);}
function shortDate(s){const d=parseDay(s);return d?`${d.getMonth()+1}/${d.getDate()}`:"—";}
function showGate(msg=""){$("gate").style.display="grid";$("header").classList.add("hidden");$("app").classList.add("hidden");$("gateErr").textContent=msg;setTimeout(()=>$("gatePass").focus(),50);}
function showApp(){$("gate").style.display="none";$("header").classList.remove("hidden");$("app").classList.remove("hidden");}
function loading(){showApp();$("app").innerHTML='<div class="loading"><div><div class="spinner"></div><div style="margin-top:12px;color:#667085">読み込み中…</div></div></div>';}
function errorView(msg){$("app").innerHTML=`<div class="card empty"><strong>${esc(msg)}</strong><br><button class="btn primary" style="margin-top:14px" onclick="fetchData()">再試行</button></div>`;}
async function fetchData(){
  const c=creds();if(!c.pass){showGate();return;}loading();$("refreshBtn").disabled=true;
  try{const r=await fetch(`${API}?coach=1&pass=${encodeURIComponent(c.pass)}`,{method:"GET",redirect:"follow"});if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(!j.ok){if(j.error==="unauthorized"){clearCreds();showGate("パスワードが違います。もう一度お試しください。");return;}throw new Error(j.error||"APIエラー");}DATA={projects:Array.isArray(j.projects)?j.projects:[],briefs:Array.isArray(j.briefs)?j.briefs:[]};render();$("lastUpdated").textContent=`最終更新 ${new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date())}`;}catch(e){errorView(`通信に失敗しました（${e.message||"不明なエラー"}）`);}finally{$("refreshBtn").disabled=false;}
}
function latest(kind){return DATA.briefs.filter(b=>b.kind===kind).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];}
function briefDateNote(b){return b.date&&b.date!==localISO()?`（${shortDate(b.date)}のぶん）`:"";}
function policyCard(b,kind){const plain=String(b.body||"").replace(/[#*`]/g,"").replace(/\s+/g," ").trim();return `<article class="card policy"><div class="date">${esc(shortDate(b.date))}</div><h3>${policyText[kind]}</h3><div class="policy-preview md"><p>${esc(plain.slice(0,300))}${plain.length>300?"…":""}</p></div><div class="policy-full md hidden">${markdown(b.body||"")}</div>${plain.length>300||String(b.body||"").includes("\n")?'<button class="expand" onclick="togglePolicy(this)">全文</button>':""}</article>`;}
function togglePolicy(btn){const card=btn.closest(".policy"),full=card.querySelector(".policy-full"),preview=card.querySelector(".policy-preview"),open=!full.classList.contains("hidden");full.classList.toggle("hidden",open);preview.classList.toggle("hidden",!open);btn.textContent=open?"全文":"閉じる";}
function projectMatches(p){if(projectFilter==="running"&&p.status!=="running")return false;if(projectFilter==="attention"&&!(["waiting_user","blocked"].includes(p.status)))return false;if(projectFilter==="closed"&&!(["paused","done"].includes(p.status)))return false;if(categoryFilter!=="all"&&p.category!==categoryFilter)return false;return !query||String(p.name||"").toLowerCase().includes(query.toLowerCase());}
function projectRow(p){const stale=staleDays(p),dd=dueDays(p),staleClass=stale>=30?"danger":stale>=14?"warn":"",dueClass=dd!==null&&dd<=7?"danger":"";const dueLabel=dd===null?"—":dd<0?`${shortDate(p.due)}（期限切れ）`:shortDate(p.due);return `<div class="project-row ${p.status==="done"?"done":""}"><div><span class="badge st-${esc(p.status)}">${esc(statusText[p.status]||p.status||"不明")}</span></div><div><div><span class="project-name">${esc(p.name||"名称未設定")}</span>${p.category?`<span class="cat">${esc(p.category)}</span>`:""}</div><div class="next">次の一手：${esc(p.next_action||"未設定")}</div></div><div class="meta"><span>担当<b>${esc(p.owner||"—")}</b></span><span>インパクト<b class="stars" aria-label="${Number(p.impact||0)}">${"★".repeat(Math.max(0,Math.min(5,Number(p.impact)||0)))}</b></span><span>進捗<b class="${staleClass}">${stale}日停滞</b></span><span>期限<b class="${dueClass}">${esc(dueLabel)}</b></span></div>${p.blocked_reason?`<div class="blocked-note">詰まり理由：${esc(p.blocked_reason)}</div>`:""}</div>`;}
function renderProjects(){const counts={running:0,waiting_user:0,blocked:0,paused:0,done:0};DATA.projects.forEach(p=>{if(counts[p.status]!==undefined)counts[p.status]++;});$("summary").textContent=`進行中${counts.running} / 待ち${counts.waiting_user} / 詰まり${counts.blocked} / 休止${counts.paused} / 完了${counts.done}`;const items=DATA.projects.filter(projectMatches).sort((a,b)=>score(b)-score(a)||String(a.name||"").localeCompare(String(b.name||""),"ja"));$("projectList").innerHTML=items.length?items.map(projectRow).join(""):'<div class="empty">該当するプロジェクトはありません</div>';}
function historyRows(){const items=DATA.briefs.filter(b=>historyKind==="all"||b.kind===historyKind).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.created).localeCompare(String(a.created)));$("historyList").innerHTML=items.length?items.map((b,i)=>`<div class="history-row"><div class="history-head" tabindex="0" role="button" aria-expanded="false" onclick="toggleHistory(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleHistory(this)}"><span class="kind">${esc(kindText[b.kind]||b.kind)}</span><span>${esc(shortDate(b.date))}</span><span class="history-title">${esc(b.title||"無題")}</span><span>⌄</span></div><div class="history-body md">${markdown(b.body||"")}</div></div>`).join(""):'<div class="empty">該当するレポートはありません</div>';}
function toggleHistory(head){const row=head.parentElement;row.classList.toggle("open");head.setAttribute("aria-expanded",row.classList.contains("open"));}
function render(){
  if(!DATA.projects.length&&!DATA.briefs.length){$("app").innerHTML='<div class="card empty">まだデータがありません</div>';return;}
  const daily=latest("daily"), policies=["weekly","monthly","quarterly","annual"].map(k=>[k,latest(k)]).filter(x=>x[1]);const cats=[...new Set(DATA.projects.map(p=>p.category).filter(Boolean))];
  $("app").innerHTML=`<section><h2 class="section-title">今朝のブリーフ</h2>${daily?`<article class="card morning"><div class="eyebrow">MORNING BRIEF ${esc(briefDateNote(daily))}</div><h2>${esc(daily.title||"今日のブリーフ")}</h2><div class="md">${markdown(daily.body||"")}</div></article>`:'<div class="card empty">今朝のブリーフはまだありません</div>'}</section>${policies.length?`<section><h2 class="section-title">今の方針</h2><div class="policy-grid">${policies.map(x=>policyCard(x[1],x[0])).join("")}</div></section>`:""}<section><h2 class="section-title">プロジェクト一覧</h2><div class="card filters"><div class="tabs">${[["all","すべて"],["running","進行中"],["attention","待ち・詰まり"],["closed","休止・完了"]].map(x=>`<button class="tab ${x[0]==="all"?"active":""}" data-filter="${x[0]}">${x[1]}</button>`).join("")}</div><select id="category" class="select" aria-label="カテゴリ"><option value="all">全カテゴリ</option>${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select><input id="search" class="search" type="search" placeholder="名前で検索" aria-label="名前で検索"></div><div id="summary" class="summary"></div><div id="projectList" class="card project-list"></div></section><section><h2 class="section-title">レポート履歴</h2><div class="card history-card"><div id="historyTools" class="history-tools">${[["all","すべて"],["daily","毎朝"],["weekly","週次"],["monthly","月次"],["quarterly","四半期"],["annual","年度"]].map(x=>`<button class="kindbtn ${x[0]==="all"?"active":""}" data-kind="${x[0]}">${x[1]}</button>`).join("")}</div><div id="historyList"></div></div></section>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{projectFilter=b.dataset.filter;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));renderProjects();});
  $("category").onchange=e=>{categoryFilter=e.target.value;renderProjects();};$("search").oninput=e=>{query=e.target.value.trim();renderProjects();};document.querySelectorAll(".kindbtn").forEach(b=>b.onclick=()=>{historyKind=b.dataset.kind;document.querySelectorAll(".kindbtn").forEach(x=>x.classList.toggle("active",x===b));historyRows();});renderProjects();historyRows();
}
$("loginForm").addEventListener("submit",e=>{e.preventDefault();const pass=$("gatePass").value;if(!pass){$("gateErr").textContent="パスワードを入力してください";return;}saveCreds($("gateMail").value.trim()||"shared",pass,$("gateKeep").checked);fetchData();});
$("refreshBtn").onclick=fetchData;$("logoutBtn").onclick=()=>{clearCreds();$("gatePass").value="";showGate("ログアウトしました");};
if(creds().pass)fetchData();else showGate();
</script>
</body>
</html>
